spring:
  application:
    name: ventanasyaluminios
  # Lee el .env de la raíz del repo al correr desde backend/ o desde la raíz (IntelliJ, mvnw). En Docker no existe y se ignora.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    # DB_HOST permite armar la URL por partes (Render entrega host, puerto, base, usuario y clave por separado).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ventanas}}
    username: ${DB_USER:${POSTGRES_USER:ventanas}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:ventanas}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Carga en lote las listas perezosas (ficha técnica y características): 3 consultas en vez de 1 + 2N.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Algo más que app.media.max-file-size para que el service responda con su propio mensaje.
      max-file-size: 6MB
      max-request-size: 6MB

server:
  # Render indica el puerto en PORT; en local y en Docker se usa SERVER_PORT o 8080.
  port: ${SERVER_PORT:${PORT:8080}}
  # Tomcat solo acepta X-Forwarded-For de proxies internos (nginx en la red de Docker) e ignora "Forwarded".
  # Con "framework", Spring tomaba la IP del encabezado "Forwarded" que manda el cliente y anulaba el límite por IP.
  forward-headers-strategy: native

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads}
    max-file-size: 5MB
  rate-limit:
    quotes:
      max-requests: 10
      window: 1h
    login:
      max-requests: 5
      window: 1m
    # Clave compartida con nginx en Render para recibir la IP real del visitante (ver ClientAddress). Vacía en Docker.
    trusted-proxy-secret: ${PROXY_SECRET:}
  auth:
    jwt-secret: ${JWT_SECRET:}
    session-duration: ${AUTH_SESSION_DURATION:8h}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    initial-admin-email: ${ADMIN_EMAIL:}
    initial-admin-password: ${ADMIN_INITIAL_PASSWORD:}
