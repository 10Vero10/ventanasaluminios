spring:
  application:
    name: ventanasyaluminios
  # Lee el .env de la raíz del repo al correr desde backend/ o desde la raíz (IntelliJ, mvnw). En Docker no existe y se ignora.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ventanas}}
    username: ${DB_USER:${POSTGRES_USER:ventanas}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:ventanas}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Algo más que app.media.max-file-size para que el service responda con su propio mensaje.
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads}
    max-file-size: 5MB
