spring:
  application:
    name: ventanasyaluminios
  # Lee el .env de la raíz del repo al correr desde backend/ o desde la raíz (IntelliJ, mvnw). En Docker no existe y se ignora.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ventanas}}
    username: ${DB_USER:${POSTGRES_USER:ventanas}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:ventanas}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Carga en lote las listas perezosas (ficha técnica y características): 3 consultas en vez de 1 + 2N.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Algo más que app.media.max-file-size para que el service responda con su propio mensaje.
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  # Tomcat solo acepta X-Forwarded-For de proxies internos (nginx en la red de Docker) e ignora "Forwarded".
  # Con "framework", Spring tomaba la IP del encabezado "Forwarded" que manda el cliente y anulaba el límite por IP.
  forward-headers-strategy: native

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads}
    max-file-size: 5MB
  rate-limit:
    quotes:
      max-requests: 10
      window: 1h
