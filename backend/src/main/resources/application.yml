spring:
  application:
    name: ventanasyaluminios
  # Lee el .env de la raíz del repo al correr desde backend/ o desde la raíz (IntelliJ, mvnw). En Docker no existe y se ignora.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    # Render (Neon, ADR-021) y Docker Compose definen DB_URL; al correr el backend suelto se usa el Postgres local.
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ventanas}}
    username: ${DB_USER:${POSTGRES_USER:ventanas}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:ventanas}}
    hikari:
      # Sin conexiones fijas: las que quedan 2 minutos sin uso se cierran, así la base de Neon se suspende cuando no hay
      # visitas reales (el despertador solo llama a /api/v1/health, que no toca la base). ADR-022.
      minimum-idle: 0
      idle-timeout: 120000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Carga en lote las listas perezosas (ficha técnica y características): 3 consultas en vez de 1 + 2N.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Algo más que app.media.max-file-size para que el service responda con su propio mensaje.
      max-file-size: 6MB
      max-request-size: 6MB

server:
  # Render indica el puerto en PORT; en local y en Docker se usa SERVER_PORT o 8080.
  port: ${SERVER_PORT:${PORT:8080}}
  # Tomcat solo acepta X-Forwarded-For de proxies de red privada (el de Render, el puerto publicado de Docker) e
  # ignora "Forwarded". Con "framework", Spring tomaba la IP del encabezado "Forwarded" que manda el cliente y anulaba
  # el límite por IP.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Host y puerto no se toman de encabezados que el cliente puede inventar: no hacen falta y así no se cuelan en
      # ninguna URL que arme el servidor.
      host-header: ""
      port-header: ""
  # No hay proxy delante que comprima: los tipos por defecto de Spring Boot más SVG.
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml

app:
  # Carpeta del frontend compilado: la define el Dockerfile. Vacía (pruebas, IDE con Vite aparte), solo API.
  site:
    dir: ${SITE_DIR:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads}
    max-file-size: 5MB
  rate-limit:
    quotes:
      max-requests: 10
      window: 1h
    login:
      max-requests: 5
      window: 1m
  auth:
    jwt-secret: ${JWT_SECRET:}
    session-duration: ${AUTH_SESSION_DURATION:8h}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    initial-admin-email: ${ADMIN_EMAIL:}
    initial-admin-password: ${ADMIN_INITIAL_PASSWORD:}
