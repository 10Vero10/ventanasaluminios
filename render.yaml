# Blueprint de Render: el sitio (nginx con el frontend) y el backend (Docker). PostgreSQL está en Neon (ADR-021).
# En Render: New → Blueprint → este repositorio. Ver README ("Publicar en internet") y ADR-020.
services:
  # Sitio público y panel: nginx sirve el frontend y reenvía /api y /media al backend, como en Docker Compose.
  - type: web
    name: ventanasyaluminios
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # free se duerme tras 15 minutos sin visitas; starter no se duerme.
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "80"
      # El plan gratis no recibe tráfico por la red privada: nginx llama al backend por su dirección pública.
      # Si Render le da otra dirección al backend, cámbiala aquí.
      - key: BACKEND_ORIGIN
        value: https://ventanasyaluminios-api.onrender.com
      # Clave con la que nginx le dice al backend la IP real del visitante (límites por IP).
      - key: PROXY_SECRET
        generateValue: true

  - type: web
    name: ventanasyaluminios-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8080"
      # Deja memoria para el resto del contenedor en planes de 512 MB.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70
      - key: PROXY_SECRET
        fromService:
          type: web
          name: ventanasyaluminios
          envVarKey: PROXY_SECRET
      # Base PostgreSQL en Neon (ADR-021). Se pegan a mano en Environment: la URL JDBC de la conexión directa
      # (sin "-pooler"), p. ej. jdbc:postgresql://ep-xxxx.us-west-2.aws.neon.tech/neondb?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Render genera una clave aleatoria de 256 bits.
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_SESSION_DURATION
        value: 8h
      - key: MEDIA_UPLOAD_DIR
        value: /app/uploads
      # Se piden al crear el Blueprint; la contraseña temporal se cambia en el primer ingreso.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

