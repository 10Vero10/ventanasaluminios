# Blueprint de Render: un solo servicio con el sitio, el panel y la API (ADR-022). PostgreSQL está en Neon (ADR-021).
# En Render: New → Blueprint → este repositorio. Ver README ("Publicar en internet").
services:
  # Un solo servicio: el backend sirve el sitio, el panel y la API (ADR-022). Con el plan gratis, un servicio despierto
  # todo el mes cabe en las horas gratis de Render; un despertador externo visita /api/v1/health para que no se duerma.
  - type: web
    name: ventanasyaluminios
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8080"
      # Deja memoria para el resto del contenedor en planes de 512 MB.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70
      # Base PostgreSQL en Neon (ADR-021). Se pegan a mano en Environment: la URL JDBC de la conexión directa
      # (sin "-pooler"), p. ej. jdbc:postgresql://ep-xxxx.us-west-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Render genera una clave aleatoria de 256 bits.
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_SESSION_DURATION
        value: 8h
      - key: MEDIA_UPLOAD_DIR
        value: /app/uploads
      # Se piden al crear el Blueprint; la contraseña temporal se cambia en el primer ingreso.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

