server {
    listen 80;
    server_name _;
    # No anunciar la versión de nginx en errores ni en la cabecera Server.
    server_tokens off;
    root /usr/share/nginx/html;

    # Margen sobre el límite de 5 MB por imagen que valida el backend.
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Spring Security también envía estas dos: se ocultan las del backend para que la respuesta lleve una sola copia.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;

    # Encabezados de proxy: X-Forwarded-For se reemplaza (no se concatena) con la IP real y se borran los que el
    # cliente podría falsear (Forwarded, X-Forwarded-Host/Port/Prefix), para que no pueda elegir su IP ante el
    # límite por IP ni alterar las URL que arma el backend.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";

    # El formulario público de cotización es JSON pequeño: un cuerpo mayor se rechaza antes de llegar al backend.
    location = /api/v1/quotes {
        client_max_body_size 64k;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /media/ {
        proxy_pass http://backend:8080;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
